name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npx expo lint
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # The generated project signs release builds with the debug keystore,
        # which is fine for installing and testing (not for the Play Store).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Register this SHA-1 with package com.assetmanager.app as an Android
      # OAuth client in Google Cloud so "Connect Google account" works.
      - name: Show signing certificate
        run: keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1|SHA256'

      - uses: actions/upload-artifact@v4
        with:
          name: asset-manager-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
